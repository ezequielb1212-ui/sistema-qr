<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión QR</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <!-- CONTENEDOR DE LOGIN (Administrador) -->
    <div id="loginContainer" class="login-wrapper">
        <div class="login-card">
            <h2>Acceso Administrativo</h2>
            <form id="loginForm">
                <input type="email" id="userInput" placeholder="Correo de administrador" required>
                <input type="password" id="passInput" placeholder="Contraseña" required>
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL DE LA APLICACIÓN -->
    <div id="appContainer" class="app-wrapper hidden">
        
        <!-- BARRA LATERAL (Historial por Fechas y Logout) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>📁 Historial de QR</h3>
                <button id="btnLogout" class="btn-logout">Cerrar Sesión</button>
            </div>
            <div id="treeMenu" class="tree-menu">
                <!-- Se llena dinámicamente -->
            </div>
        </aside>

        <!-- CONTENIDO CENTRAL (Formulario y Generador) -->
        <main class="main-content">
            <header class="main-header">
                <h1>Generador y Gestor de Códigos QR</h1>
            </header>

            <section class="form-section">
                <form id="qrForm">
                    <div class="input-group">
                        <label for="titulo">Título del Registro:</label>
                        <input type="text" id="titulo" placeholder="Ej: Control de Mantenimiento #1" required>
                    </div>

                    <div class="input-group">
                        <label for="contenido">Descripción / Información:</label>
                        <textarea id="contenido" rows="3" placeholder="Detalles visibles al escanear el QR..." required></textarea>
                    </div>

                    <div class="input-group">
                        <label for="imagenesInput">Adjuntar Imágenes:</label>
                        <input type="file" id="imagenesInput" accept="image/*" multiple>
                    </div>

                    <!-- Galería de previsualización de imágenes comprimidas -->
                    <div id="previewGallery" class="preview-gallery hidden">
                        <p>Imágenes preparadas:</p>
                        <div id="thumbnailsContainer"></div>
                    </div>

                    <button type="submit" class="btn-success">Guardar y Generar QR</button>
                </form>

                <p id="statusMsg" class="status-msg hidden"></p>
            </section>

            <!-- SECCIÓN DEL CÓDIGO QR GENERADO -->
            <section class="qr-output-section">
                <div id="qrcode"></div>
                <div id="qrActions" class="qr-actions hidden">
                    <button id="btnPrint" class="btn-secondary">🖨️ Imprimir QR</button>
                    <button id="btnCopy" class="btn-secondary">📋 Copiar Enlace</button>
                </div>
            </section>
        </main>
    </div>

    <!-- MODAL VISOR PÚBLICO (Se abre al escanear el QR o hacer clic en el historial) -->
    <div id="viewerModal" class="modal hidden">
        <div class="modal-content">
            <button id="btnCloseViewer" class="btn-close">×</button>
            <h2 id="viewerTitle">Título del Registro</h2>
            <p id="viewerContent">Información detallada...</p>
            <div id="viewerImages" class="viewer-images-grid">
                <!-- Imágenes adjuntas -->
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script type="module" src="app.js"></script>
</body>
</html>
