<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Gestión de Registros y QR</title>
    
    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Cropper.js (Librería profesional de recorte estilo CamScanner) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==========================================
        PANTALLA DE LOGIN
        ========================================== -->
    <div id="loginContainer" class="login-wrapper">
        <div class="login-card">
            <img src="imagenes22/movil 8 .png" alt="Logo del Sistema" class="login-logo">
            <h2>Acceso al Sistema QR Derivación</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="userInput">Correo electrónico</label>
                    <input type="email" id="userInput" required placeholder="admin@sistema.com">
                </div>
                <div class="input-group">
                    <label for="passInput">Contraseña</label>
                    <input type="password" id="passInput" required placeholder="••••••••••••">
                </div>
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- ==========================================
        APLICACIÓN PRINCIPAL
        ========================================== -->
    <div id="appContainer" class="app-layout hidden">
        
        <!-- Sidebar / Historial Lateral -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Historial Pacientes</h3>
                <button id="btnLogout" class="btn-logout">Salir</button>
            </div>
            <div id="treeMenu" class="tree-menu">
                <!-- Se llena dinámicamente -->
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <div class="form-card">
                <h2>Nuevo Registro y Código QR</h2>
                
                <form id="qrForm">
                    <div class="input-group">
                        <label for="titulo">Nombre y Apellido Paciente</label>
                        <input type="text" id="titulo" required placeholder="Ej: Juan Pérez">
                    </div>

                    <div class="input-group">
                        <label for="contenido">Obra Social / Detalle</label>
                        <textarea id="contenido" required placeholder="Detalles de la información..."></textarea>
                    </div>

                    <div class="input-group">
                        <label class="file-label" for="archivosInput">📁 Adjuntar Fotos o PDFs</label>
                        <input type="file" id="archivosInput" accept="image/*,application/pdf" multiple style="display: none;">
                    </div>

                    <div id="previewGallery" class="hidden">
                        <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Archivos seleccionados (haz clic en una imagen para recortar y editar):</label>
                        <div class="thumbnails-container" id="thumbnailsContainer"></div>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 20px;">Guardar y Generar QR</button>
                </form>

                <div id="statusMsg" class="hidden" style="margin-top: 15px; font-weight: 600; text-align: center;"></div>

                <!-- Sección de resultado del QR -->
                <div id="qrActions" class="qr-result-section hidden">
                    <div id="qrcode"></div>
                    <div class="action-buttons">
                        <button id="btnPrint" class="btn-secondary">🖨️ Imprimir</button>
                        <button id="btnCopy" class="btn-secondary">📋 Copiar Enlace</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ==========================================
        MODAL VISOR CARRUSEL
        ========================================== -->
    <div id="viewerModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <h3 id="viewerTitle">Título</h3>
                    <p id="viewerContent" style="color: #94a3b8; font-size: 0.8rem; margin-top: 2px;"></p>
                </div>
                <button id="btnCloseViewer" class="btn-close">&times;</button>
            </div>
            <div class="modal-body" id="viewerImages"></div>
        </div>
    </div>

    <!-- ==========================================
        MODAL EDITOR Y RECORTE CAMSCANNER
        ========================================== -->
    <div id="editorModal" class="modal hidden">
        <div class="modal-content editor-modal-content">
            <div class="modal-header">
                <h3>Edición CamScanner - Recortar y Mejorar</h3>
                <button id="btnCloseEditor" class="btn-close">&times;</button>
            </div>
            <div class="modal-body editor-body">
                <div class="canvas-container">
                    <img id="editorImage" src="" alt="Imagen a editar" style="max-width: 100%; max-height: 65vh; display: block;">
                </div>
                <div class="editor-controls">
                    <button id="btnRotateLeft" class="btn-secondary">🔄 Rotar Izq</button>
                    <button id="btnRotateRight" class="btn-secondary">🔄 Rotar Der</button>
                    <button id="btnBwFilter" class="btn-secondary">📄 Escáner B/N</button>
                    <button id="btnResetFilter" class="btn-secondary">⏮️ Resetear</button>
                    
                    <div class="slider-group">
                        <label>Brillo</label>
                        <input type="range" id="brightnessInput" min="50" max="150" value="100">
                    </div>
                    <div class="slider-group">
                        <label>Contraste</label>
                        <input type="range" id="contrastInput" min="50" max="200" value="100">
                    </div>
                    <button id="btnSaveEdit" class="btn-primary">✂️ Aplicar Recorte y Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
