<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Gestión de Registros y QR</title>
    <!-- Librería para generar códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==========================================
        PANTALLA DE LOGIN
        ========================================== -->
    <div id="loginContainer" class="login-wrapper">
        <div class="login-card">
            <!-- Logo opcional arriba del título -->
            <img src="imagenes22/movil 8 .png" alt="Logo del Sistema" class="login-logo">
            
            <h2>Acceso al Sistema Qr Derivacion</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="userInput">Correo electrónico</label>
                    <input type="email" id="userInput" required placeholder="admin@sistema.com">
                </div>
                <div class="input-group">
                    <label for="passInput">Contraseña</label>
                    <input type="password" id="passInput" required placeholder="••••••••••••">
                </div>
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- ==========================================
        APLICACIÓN PRINCIPAL (PANEL ADMIN Y FORMULARIO)
        ========================================== -->
    <div id="appContainer" class="app-layout hidden">
        
        <!-- Sidebar / Historial Lateral Retráctil -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Historial</h3>
                <button id="btnLogout" class="btn-logout">Salir</button>
            </div>
            <div id="treeMenu" class="tree-menu">
                <!-- Se llena dinámicamente -->
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <div class="form-card">
                <h2>Nuevo Registro y Código QR</h2>
                
                <form id="qrForm">
                    <div class="input-group">
                        <label for="titulo">Nombre y Apellido Paciente</label>
                        <input type="text" id="titulo" required placeholder="Ej: Mantenimiento Unidad 03">
                    </div>

                    <div class="input-group">
                        <label for="contenido">Obra Social </label>
                        <textarea id="contenido" required placeholder="Detalles de la información..."></textarea>
                    </div>

                    <div class="input-group">
                        <label class="file-label" for="imagenesInput">📁 Seleccionar Imágenes</label>
                        <input type="file" id="imagenesInput" accept="image/*" multiple style="display: none;">
                    </div>

                    <div id="previewGallery" class="hidden">
                        <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Imágenes seleccionadas:</label>
                        <div class="thumbnails-container" id="thumbnailsContainer"></div>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 20px;">Guardar y Generar QR</button>
                </form>

                <div id="statusMsg" class="hidden" style="margin-top: 15px; font-weight: 600; text-align: center;"></div>

                <!-- Sección de resultado del QR -->
                <div id="qrActions" class="qr-result-section hidden">
                    <div id="qrcode"></div>
                    <div class="action-buttons">
                        <button id="btnPrint" class="btn-secondary">🖨️ Imprimir</button>
                        <button id="btnCopy" class="btn-secondary">📋 Copiar Enlace</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ==========================================
        VISOR DE IMÁGENES / MODAL (CARRUSEL 1 X 1)
        ========================================== -->
    <div id="viewerModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title-wrap">
                    <h3 id="viewerTitle">Título</h3>
                    <p id="viewerContent" style="color: #94a3b8; font-size: 0.8rem; margin-top: 2px;"></p>
                </div>
                <button id="btnCloseViewer" class="btn-close">&times;</button>
            </div>
            <div class="modal-body" id="viewerImages">
                <!-- Carrusel inyectado por JS -->
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
